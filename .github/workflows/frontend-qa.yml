name: Frontend QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save @playwright/test@1.56.1 @axe-core/playwright@4.10.2
      - run: npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/taamerat360-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/taamerat360-server.log
          exit 1
      - run: npx playwright test
      - name: Check live proposal-link destination
        if: always()
        shell: bash
        run: |
          code=$(curl -L -s -o /tmp/taamerat-contact.html -w "%{http_code}" --connect-timeout 10 --max-time 20 "https://taamerat360-motion.margotdperrin67761.chatgpt.site/contact-us/" || true)
          echo "Original proposal destination HTTP status: $code"
          if [ "$code" != "200" ]; then echo "::warning::Original proposal destination is not confirmed accessible (HTTP $code)"; fi
      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-report
          path: |
            qa-report/
            screenshots/
            test-results/
          if-no-files-found: ignore
          retention-days: 7